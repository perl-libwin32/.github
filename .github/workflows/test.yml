name: test

on:
  workflow_call:
    inputs:
      test-command:
        description: Command that runs the test suite (Strawberry jobs).
        type: string
        default: 'cpanm --test-only --verbose .'
      installdeps-command:
        description: Command that installs build dependencies.
        type: string
        default: 'cpanm --installdeps --notest .'
      perl-versions:
        description: JSON array of Perl versions for the 64-bit Strawberry matrix.
        type: string
        default: '["5.32", "5.36", "5.38", "5.40"]'

jobs:
  strawberry:
    name: Strawberry ${{ matrix.perl-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJSON(inputs.perl-versions) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 'Enable 8.3 name creation on D: (the GHA worker volume)'
        shell: pwsh
        run: |
          fsutil 8dot3name set D: 0
          fsutil 8dot3name query D:
      - uses: shogo82148/actions-setup-perl@9f8c263975569ff3b4e510cb1f8813115749e146 # v1.41.0
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry
      - run: perl -V
      - run: ${{ inputs.installdeps-command }}
      - run: ${{ inputs.test-command }}

  strawberry-32bit:
    name: Strawberry 5.38.2.1 (32-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 'Enable 8.3 name creation on D: (the GHA worker volume)'
        shell: pwsh
        run: |
          fsutil 8dot3name set D: 0
          fsutil 8dot3name query D:
      - name: Install 32-bit Strawberry Perl
        shell: pwsh
        run: |
          $url = 'https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_5382_32bit/strawberry-perl-5.38.2.1-32bit-portable.zip'
          $zip = "$env:RUNNER_TEMP\strawberry32.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\strawberry32
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\strawberry32\perl\site\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\strawberry32\perl\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\strawberry32\c\bin'
      - run: perl -V
      - run: ${{ inputs.installdeps-command }}
      - run: ${{ inputs.test-command }}

  utf8-acp:
    name: UTF-8 ACP (Strawberry ${{ matrix.perl-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version: ['5.40']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 'Enable 8.3 name creation on D: (the GHA worker volume)'
        shell: pwsh
        run: |
          fsutil 8dot3name set D: 0
          fsutil 8dot3name query D:
      - uses: shogo82148/actions-setup-perl@9f8c263975569ff3b4e510cb1f8813115749e146 # v1.41.0
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry
      # Embed the per-process UTF-8 ACP opt-in (Windows 10 1903+) into
      # perl.exe so the rest of the job runs as if the system code page
      # were CP_UTF8. External .manifest files are ignored when the exe
      # already has an embedded manifest, so we rewrite it with mt.exe.
      - name: Enable UTF-8 ACP for perl.exe
        shell: pwsh
        run: |
          $perl = (Get-Command perl).Source
          $manifest = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <application xmlns="urn:schemas-microsoft-com:asm.v3">
              <windowsSettings>
                <activeCodePage xmlns="http://schemas.microsoft.com/SMI/2019/WindowsSettings">UTF-8</activeCodePage>
              </windowsSettings>
            </application>
          </assembly>
          '@
          Set-Content -Path perl-utf8.manifest -Value $manifest -Encoding UTF8
          $before = (& $perl -MWin32 -e 'print Win32::GetACP()')
          Write-Host "GetACP() before manifest patch: $before"
          $mt = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64\\mt\.exe$' } |
                Select-Object -First 1
          if (-not $mt) { throw 'mt.exe not found' }
          & $mt.FullName -manifest perl-utf8.manifest "-outputresource:${perl};1"
          $after = (& $perl -MWin32 -e 'print Win32::GetACP()')
          Write-Host "GetACP() after manifest patch:  $after"
          if ($after -ne '65001') { throw "GetACP() returned $after; expected 65001" }
      - run: perl -V
      - run: ${{ inputs.installdeps-command }}
      - run: ${{ inputs.test-command }}

  cygwin:
    name: Cygwin (${{ matrix.cc }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, g++]
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
    steps:
      - name: Preserve LF line endings on checkout
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 'Enable 8.3 name creation on D: (the GHA worker volume)'
        shell: pwsh
        run: |
          fsutil 8dot3name set D: 0
          fsutil 8dot3name query D:
      - uses: cygwin/cygwin-install-action@711d29f3da23c9f4a1798e369a6f01198c13b11a # v6.1
        with:
          packages: >-
            perl
            perl-ExtUtils-MakeMaker
            make
            gcc-core
            gcc-g++
            libcrypt-devel
            curl
      - name: Build and test
        run: |
          cd "$(cygpath --unix "$GITHUB_WORKSPACE")"
          perl -V
          curl --fail --silent --location https://cpanmin.us --output /tmp/cpanm
          perl /tmp/cpanm --notest App::cpanminus
          cpanm --installdeps --notest .
          if [ "${{ matrix.cc }}" = "g++" ]; then
            cpanm --test-only --verbose --configure-args "CC=g++" .
          else
            cpanm --test-only --verbose .
          fi
