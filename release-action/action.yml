name: Perl Win32 release
description: Validate metadata, build the CPAN tarball, and publish a GitHub Release.

inputs:
  version-file:
    description: Path to the .pm file holding $VERSION.
    required: true
  dist-name:
    description: Distribution name (e.g. Win32, Win32-Process).
    required: true
  meta-file:
    description: Path to META.yml.
    required: false
    default: META.yml
  changelog-file:
    description: Path to the changelog file.
    required: false
    default: CHANGES.md
  canonical-email:
    description: Author email that must appear in META.yml.
    required: false
    default: jan@jandubois.com
  perl-version:
    description: Perl version to install.
    required: false
    default: '5.40'

runs:
  using: composite
  steps:
    - id: setup-perl
      uses: shogo82148/actions-setup-perl@9f8c263975569ff3b4e510cb1f8813115749e146 # v1.41.0
      with:
        perl-version: ${{ inputs.perl-version }}
        distribution: strawberry

    - name: Locate Strawberry Perl
      id: perl
      shell: bash
      run: |
        set -euo pipefail
        # Git Bash on the Windows runner ships its own perl.exe in /usr/bin
        # ahead of Strawberry on PATH. Pin to the actual Strawberry binary
        # under hostedtoolcache so subsequent steps invoke the right one.
        bin=$(ls -d /c/hostedtoolcache/windows/strawberry-perl/*/x64/perl/bin/perl.exe 2>/dev/null | tail -1)
        if [ -z "$bin" ] || [ ! -x "$bin" ]; then
          echo "::error::Could not find Strawberry perl.exe under /c/hostedtoolcache/windows/strawberry-perl"
          exit 1
        fi
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
        "$bin" -V | head -1

    - name: Determine tag version
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if [[ "$version" == *_* ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate release artefacts
      shell: bash
      env:
        PERL:            ${{ steps.perl.outputs.bin }}
        VERSION_FILE:    ${{ inputs.version-file }}
        META_FILE:       ${{ inputs.meta-file }}
        CHANGELOG_FILE:  ${{ inputs.changelog-file }}
        DIST_NAME:       ${{ inputs.dist-name }}
        CANONICAL_EMAIL: ${{ inputs.canonical-email }}
      run: |
        "$PERL" "$GITHUB_ACTION_PATH/release-checks.pl" \
          --tag "$GITHUB_REF_NAME" \
          --version-file "$VERSION_FILE" \
          --meta-file "$META_FILE" \
          --changelog-file "$CHANGELOG_FILE" \
          --dist-name "$DIST_NAME" \
          --canonical-email "$CANONICAL_EMAIL" \
          --expected-repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

    - name: Build distribution tarball
      id: dist
      shell: bash
      env:
        PERL:        ${{ steps.perl.outputs.bin }}
        DIST_NAME:   ${{ inputs.dist-name }}
        TAG_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        set -euo pipefail
        "$PERL" Makefile.PL
        make_cmd=$("$PERL" -MConfig -e 'print $Config{make}')
        "$make_cmd" dist
        tarball="${DIST_NAME}-${TAG_VERSION}.tar.gz"
        if [ ! -f "$tarball" ]; then
          echo "::error::make dist did not produce $tarball"
          ls -la *.tar.gz 2>/dev/null || true
          exit 1
        fi
        echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

    - name: Extract changelog entry for release notes
      id: notes
      shell: bash
      env:
        PERL:           ${{ steps.perl.outputs.bin }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        TAG_VERSION:    ${{ steps.tag.outputs.version }}
      run: |
        set -euo pipefail
        notes_file="$RUNNER_TEMP/release-notes.md"
        "$PERL" -e '
          use strict;
          my ($file, $version) = @ARGV;
          open my $fh, "<:utf8", $file or die "open $file: $!\n";
          my $in = 0;
          my @block;
          while (<$fh>) {
              if (/^##\s+\Q$version\E\s+\[/) { $in = 1; next; }
              last if $in && /^##\s+\d+(?:\.\d+)?(?:_\d+)?\s+\[/;
              push @block, $_ if $in;
          }
          die "no changelog entry for $version in $file\n" unless @block;
          pop @block while @block && $block[-1] =~ /^\s*$/;
          my $min = 1e9;
          for (@block) {
              next if /^\s*$/;
              my ($lead) = /^(\s*)/;
              $min = length($lead) if length($lead) < $min;
          }
          $min = 0 if $min == 1e9;
          for (@block) {
              s/^[ \t]{$min}// if length($_) > $min;
          }
          binmode STDOUT, ":utf8";
          print @block;
        ' "$CHANGELOG_FILE" "$TAG_VERSION" > "$notes_file"
        echo "file=$notes_file" >> "$GITHUB_OUTPUT"
        echo "----- release notes preview -----"
        cat "$notes_file"
        echo "----- end -----"

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN:   ${{ github.token }}
        TARBALL:    ${{ steps.dist.outputs.tarball }}
        PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        NOTES_FILE: ${{ steps.notes.outputs.file }}
      run: |
        set -euo pipefail
        flag=()
        if [ "$PRERELEASE" = "true" ]; then
          flag+=(--prerelease)
        fi
        gh release create "$GITHUB_REF_NAME" "$TARBALL" \
          --title "$GITHUB_REF_NAME" \
          --notes-file "$NOTES_FILE" \
          "${flag[@]}"
